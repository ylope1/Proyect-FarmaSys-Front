<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <title>Reseteo Contraseña | FarmaSys</title>
    <!-- Favicon-->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=latin,cyrillic-ext" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" type="text/css">

    <!-- Bootstrap Core Css -->
    <link href="plugins/bootstrap/css/bootstrap.css" rel="stylesheet">

    <!-- Waves Effect Css -->
    <link href="plugins/node-waves/waves.css" rel="stylesheet" />

    <!-- Sweetalert Css -->
    <link href="plugins/sweetalert/sweetalert.css" rel="stylesheet" />

    <!-- Animation Css -->
    <link href="plugins/animate-css/animate.css" rel="stylesheet" />

    <!-- Custom Css -->
    <link href="css/style.css" rel="stylesheet">

    <style>
        .signup-box .logo a,
        .signup-box .logo small {
            color: #000 !important;
        }
    </style>
</head>

<body class="signup-page">
    <div class="signup-box">
        <div class="logo">
            <a href="javascript:void(0);">FarmaSys</a>
            <small>Restablecimiento de Contraseña</small>
        </div>
        <div class="card">
            <div class="body">
                <div class="msg">
                    Ingrese su nueva contraseña para recuperar el acceso al sistema.
                </div>

                <input type="hidden" id="token">
                <input type="hidden" id="email">

                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="material-icons">lock</i>
                    </span>
                    <div class="form-line">
                        <input type="password" class="form-control" id="password" placeholder="Nueva contraseña" required autofocus>
                    </div>
                </div>

                <div class="input-group">
                    <span class="input-group-addon">
                        <i class="material-icons">lock</i>
                    </span>
                    <div class="form-line">
                        <input type="password" class="form-control" id="password_confirmation" placeholder="Confirmar contraseña" required>
                    </div>
                </div>

                <button class="btn btn-block btn-lg bg-green waves-effect" type="button" onclick="resetearPassword();">
                    ACTUALIZAR CONTRASEÑA
                </button>

                <div class="m-t-25 m-b--5 align-center">
                    <a href="index.html">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Jquery Core Js -->
    <script src="plugins/jquery/jquery.min.js"></script>

    <!-- Bootstrap Core Js -->
    <script src="plugins/bootstrap/js/bootstrap.js"></script>

    <!-- Waves Effect Plugin Js -->
    <script src="plugins/node-waves/waves.js"></script>

    <!-- Validation Plugin Js -->
    <script src="plugins/jquery-validation/jquery.validate.js"></script>

    <!-- SweetAlert Plugin Js -->
    <script src="plugins/sweetalert/sweetalert.min.js"></script>

    <!-- Custom Js -->
    <script src="js/admin.js"></script>
    <script src="js/pages/examples/sign-up.js"></script>
    <script src="js/ruta.js"></script>

    <script>
        sessionStorage.removeItem('datosSesion');
        sessionStorage.removeItem('rolSesion');
        sessionStorage.removeItem('permisosSesion');
        sessionStorage.removeItem('accessToken');
        sessionStorage.removeItem('token_type');

        function obtenerParametro(nombre) {
            var url = new URL(window.location.href);
            return url.searchParams.get(nombre);
        }

        $(document).ready(function () {
            var token = obtenerParametro('token');
            var email = obtenerParametro('email');

            if (token == null || email == null || token.trim() === "" || email.trim() === "") {
                swal({
                    title: "Atención",
                    text: "El enlace de recuperación no es válido.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                }, function () {
                    window.location = "index.html";
                });
                return;
            }

            $("#token").val(token);
            $("#email").val(email);
        });

        function resetearPassword() {

            var password = $("#password").val();
            var passwordConfirmation = $("#password_confirmation").val();

            if (password === "") {
                swal({
                    title: "Atención",
                    text: "Debe ingresar la nueva contraseña.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });
                return;
            }

            if (password.length < 3) {
                swal({
                    title: "Atención",
                    text: "La contraseña debe tener al menos 3 caracteres.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });
                return;
            }

            if (passwordConfirmation === "") {
                swal({
                    title: "Atención",
                    text: "Debe confirmar la nueva contraseña.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });
                return;
            }

            if (password !== passwordConfirmation) {
                swal({
                    title: "Atención",
                    text: "Las contraseñas no coinciden.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });
                return;
            }

            $.ajax({
                url: getUrl() + "reset-password",
                method: "POST",
                dataType: "json",
                data: {
                    "email": $("#email").val(),
                    "token": $("#token").val(),
                    "password": password,
                    "password_confirmation": passwordConfirmation
                }
            })
            .done(function (resultado) {
                swal({
                    title: "Correcto",
                    text: resultado.message,
                    type: "success",
                    confirmButtonText: "Aceptar"
                }, function () {
                    window.location = "index.html";
                });
            })
            .fail(function (a,b,c) {

                var mensaje = "No se pudo actualizar la contraseña.";

                if (a.responseJSON && a.responseJSON.message) {
                    mensaje = a.responseJSON.message;
                } else if (a.responseJSON && a.responseJSON.errors) {
                    mensaje = JSON.stringify(a.responseJSON.errors);
                } else if (a.responseText) {
                    try {
                        var error = JSON.parse(a.responseText);
                        mensaje = error.message || mensaje;
                    } catch (e) {
                        mensaje = a.responseText;
                    }
                }

                swal({
                    title: "Atención",
                    text: mensaje,
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });

                console.log(a.responseText);
            });
        }
    </script>
</body>

</html>
