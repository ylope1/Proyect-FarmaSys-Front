<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <title>Olvido su Contraseña | FarmaSys</title>
    <!-- Favicon-->
    <link rel="icon" href="images/logo_miniatura.jpg" type="image/jpeg">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&subset=latin,cyrillic-ext" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" type="text/css">

    <!-- Bootstrap Core Css -->
    <link href="plugins/bootstrap/css/bootstrap.css" rel="stylesheet">

    <!-- Waves Effect Css -->
    <link href="plugins/node-waves/waves.css" rel="stylesheet" />

    <!-- Sweetalert Css -->
    <link href="plugins/sweetalert/sweetalert.css" rel="stylesheet" />

    <!-- Animation Css -->
    <link href="plugins/animate-css/animate.css" rel="stylesheet" />

    <!-- Custom Css -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="fp-page">
    <div class="fp-box">
        <div class="logo">
            <a href="javascript:void(0);">BIENVENIDO</a>
            <small>Sistema de Gestion - FarmaSys</small>
        </div>
        <div class="card">
            <div class="body">
                <form id="forgot_password" method="POST">
                    <div class="msg">
                        Ingrese su usuario o correo electrónico registrado. Le enviaremos un enlace para restablecer su contraseña.
                    </div>
                    <div class="input-group">
                        <span class="input-group-addon">
                            <i class="material-icons">person</i><i class="material-icons">email</i>
                        </span>
                        <div class="form-line">
                            <input type="text" class="form-control" id="usuario" placeholder="Usuario o Correo" required autofocus>
                        </div>
                    </div>

                    <button class="btn btn-block btn-lg bg-green waves-effect" type="button" onclick="recuperarPassword();">
                        RECUPERAR CONTRASEÑA
                    </button>

                    <div class="row m-t-20 m-b--5 align-center">
                        <a href="index.html">Volver al inicio de sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Jquery Core Js -->
    <script src="plugins/jquery/jquery.min.js"></script>

    <!-- Bootstrap Core Js -->
    <script src="plugins/bootstrap/js/bootstrap.js"></script>

    <!-- Waves Effect Plugin Js -->
    <script src="plugins/node-waves/waves.js"></script>

    <!-- Validation Plugin Js -->
    <script src="plugins/jquery-validation/jquery.validate.js"></script>

    <!-- SweetAlert Plugin Js -->
    <script src="plugins/sweetalert/sweetalert.min.js"></script>

    <!-- Custom Js -->
    <script src="js/admin.js"></script>
    <script src="js/pages/examples/forgot-password.js"></script>
    <script src="js/ruta.js"></script>

    <script>
        sessionStorage.removeItem('datosSesion');
        sessionStorage.removeItem('rolSesion');
        sessionStorage.removeItem('permisosSesion');
        sessionStorage.removeItem('accessToken');
        sessionStorage.removeItem('token_type');

        function recuperarPassword(){

            var usuario = $("#usuario").val().trim();

            if (usuario === "") {
                swal({
                    title: "Atención",
                    text: "Debe ingresar su usuario o correo electrónico.",
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });
                return;
            }

            $.ajax({
                url: getUrl() + "forgot-password",
                method: "POST",
                dataType: "json",
                data: {
                    "usuario": usuario
                }
            })
            .done(function(resultado){

                swal({
                    title: "Correcto",
                    text: resultado.message,
                    type: "success",
                    confirmButtonText: "Aceptar"
                });

                $("#usuario").val('');
            })
            .fail(function(a,b,c){

                var mensaje = "No se pudo procesar la solicitud.";

                if (a.responseJSON && a.responseJSON.message) {
                    mensaje = a.responseJSON.message;
                } else if (a.responseText) {
                    try {
                        var error = JSON.parse(a.responseText);
                        mensaje = error.message || mensaje;
                    } catch (e) {
                        mensaje = a.responseText;
                    }
                }

                swal({
                    title: "Atención",
                    text: mensaje,
                    type: "warning",
                    confirmButtonText: "Aceptar"
                });

                console.log(a.responseText);
            });
        }
    </script>

</body>

</html>
